<!DOCTYPE html>
<html lang="fr">
<head>
<script src="/js/storage-namespace-migration.js"></script>
<script src="/js/transition-pages.js"></script>
<meta charset="UTF-8"/>
<link rel="icon" href="favicon.svg" type="image/svg+xml"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"/>
<meta name="robots" content="noindex, nofollow"/>
<link rel="manifest" href="manifest.json"/>
<meta name="theme-color" content="#111111"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="apple-mobile-web-app-title" content="Bokki Admin"/>
<link rel="apple-touch-icon" href="../assets/bokki-admin-apple-touch.png"/>
<script>
(function(){
  var theme = localStorage.getItem('bokki-theme') || 'jour';
  document.documentElement.setAttribute('data-theme', theme);
})();
</script>
<title>Bokki Admin — Incidents et SOS</title>
<link rel="stylesheet" href="../assets/fonts/fonts.css"/>
<link rel="stylesheet" href="../css/base.css"/>
<link rel="stylesheet" href="../css/admin.css"/>
<link rel="modulepreload" href="/vendor/vue-3.5.42.esm-browser.prod.js"/>
<link rel="stylesheet" href="../css/theme-jour.css"/>
<link rel="stylesheet" href="../css/theme-nuit.css"/>
<!-- Même coquille de page que Livreurs (feuilles par page). -->
<link rel="stylesheet" href="../css/pages/admin-07-livreurs.css"/>
<link rel="stylesheet" href="../css/pages/admin-16-mes-livraisons.css"/>
<link rel="stylesheet" href="../css/pages/admin-17-livraisons.css"/>
<link rel="stylesheet" href="../css/pages/admin-18-paiements.css"/>
  <link rel="stylesheet" href="../assets/phosphor/phosphor-subset.css"/>
<link rel="stylesheet" href="../css/admin-app.css"/>
<link rel="preconnect" href="https://www.gstatic.com" crossorigin/>
<!-- Polices communes à toutes les pages admin : déjà en cache, elles sont demandées dès le début, sans quoi le
     premier affichage se ferait avec une police de secours puis basculerait (titre « Commandes » → « COMMANDES »).
     Pas au premier chargement : en 3G elles passaient avant le reste et retardaient l'affichage de 5 s. -->
<script>if(navigator.serviceWorker&&navigator.serviceWorker.controller)['/assets/fonts/space-grotesk-400.woff2','/assets/fonts/bebas-neue-400.woff2','/assets/fonts/jetbrains-mono-500.woff2','/assets/fonts/fraunces-900.woff2','/assets/phosphor/Phosphor.subset.woff2','/assets/phosphor/Phosphor-Bold.subset.woff2'].forEach(function(f){document.write('<link rel="preload" href="'+f+'" as="font" type="font/woff2" crossorigin/>')})</script>
<script type="module" src="../js/admin/incidents.js"></script>
<script type="module" src="../js/admin/sidebar-component.js"></script>
<!-- Transitions sans à-coup : quand le service worker a déjà la page en main, elle n'est affichée qu'une fois
     Vue monté (mêmes scripts repris en blocking="render", exécutés une seule fois), la page précédente restant
     à l'écran comme dans une appli. Au premier chargement, pas de blocage : le navigateur ne le lèverait qu'à
     l'arrivée des scripts (écran vide de 7 s et plus en 3G) ; « Chargement… » de v-cloak s'affiche à la place. -->
<script>if(navigator.serviceWorker&&navigator.serviceWorker.controller)['../js/admin/incidents.js','../js/admin/sidebar-component.js'].forEach(function(s){document.write('<script type="module" blocking="render" src="'+s+'"><\/script>')})</script>
</head>
<body>
<div id="scrollProgress"></div>

<div id="adminSidebar"></div>

<div id="incidentsApp" v-cloak>
<div class="main">
  <div class="topbar">
    <div>
      <div class="tb-title">{{ choisie ? choisie.titre : 'Incidents et SOS' }}</div>
      <div class="tb-date">{{ choisie ? (choisie.nom || '') : 'Alertes et suivi des incidents' }}</div>
    </div>
  </div>
  <div class="content">
    <p v-if="message" class="ml-message" :class="messageType" role="status">{{ message }}</p>
    <template v-if="choisie">
      <button class="ml-retour" @click="retour"><i class="ph-bold ph-arrow-left" style="font-size:14px" aria-hidden="true"></i>Incidents et SOS</button>
      <div class="lm-grille">
        <div class="panel lv-alerte" :class="{auto: choisie.type !== 'sos'}"><div class="panel-body">
          <div class="lm-carte-ligne"><h2 class="lv-h2 lm-titre">{{ choisie.titre }}</h2><span class="ml-pastille" :class="ETATS[choisie.etat]?.cls">{{ ETATS[choisie.etat]?.label }}</span></div>
          <dl class="lv-defs">
            <dt>Reçu</dt><dd>{{ dateHeure(choisie.date) }}</dd>
            <dt>Personne</dt><dd>{{ choisie.nom || '—' }}</dd>
            <dt>Commande</dt><dd>{{ choisie.numero || '—' }}</dd>
            <dt>Positions reçues</dt><dd>{{ choisie.nbPositions || positions.length }}</dd>
            <dt v-if="choisie.reponduLe">A répondu</dt><dd v-if="choisie.reponduLe">à {{ heure(choisie.reponduLe) }}</dd>
            <dt v-if="choisie.dernierePosition">Dernière position</dt><dd v-if="choisie.dernierePosition">{{ heure(choisie.dernierePosition.date) }}</dd>
            <dt v-if="choisie.dernierePosition">Coordonnées exactes</dt><dd v-if="choisie.dernierePosition">{{ choisie.dernierePosition.lat.toFixed(6) }}, {{ choisie.dernierePosition.lng.toFixed(6) }}<template v-if="choisie.dernierePosition.precision != null"> · à {{ choisie.dernierePosition.precision }} m près</template></dd>
            <dt v-if="choisie.contactUrgence">Contact d'urgence</dt><dd v-if="choisie.contactUrgence">{{ choisie.contactUrgence }}</dd>
            <dt v-if="choisie.priseParNom">Pris en charge par</dt><dd v-if="choisie.priseParNom">{{ choisie.priseParNom }}</dd>
            <dt v-if="choisie.clotureeParNom">Clôturé par</dt><dd v-if="choisie.clotureeParNom">{{ choisie.clotureeParNom }}</dd>
            <dt v-if="choisie.note">Note</dt><dd v-if="choisie.note">{{ choisie.note }}</dd>
          </dl>
          <div class="lv-actions">
            <a v-if="telephone" class="ml-btn" :href="'tel:' + telephone"><i class="ph-bold ph-phone" style="font-size:16px" aria-hidden="true"></i>Appeler</a>
            <a v-if="lienCarte(choisie)" class="ml-btn" :href="lienCarte(choisie)" target="_blank" rel="noopener"><i class="ph-bold ph-map-pin" style="font-size:16px" aria-hidden="true"></i>Itinéraire Google Maps</a>
            <button v-if="choisie.etat === 'active'" class="ml-btn noir" :disabled="envoi" @click="traiter('prendre')">{{ envoi ? 'Envoi…' : 'Je prends en charge' }}</button>
          </div>
          <template v-if="['active', 'prise_en_charge'].includes(choisie.etat)">
            <label class="lv-note">Note de clôture (facultatif)<textarea v-model="note" maxlength="500" rows="2"></textarea></label>
            <div class="lv-actions"><button class="ml-btn" :disabled="envoi" @click="traiter('cloturer')">{{ envoi ? 'Envoi…' : 'Clôturer' }}</button></div>
          </template>
          <div class="lv-actions" v-if="termine(choisie)"><button type="button" class="ml-btn" @click="demander([choisie])">Supprimer</button></div>
        </div></div>
        <div class="panel"><div class="panel-body">
          <h2 class="lv-h2">Position de l'alerte</h2>
          <div v-show="choisie.dernierePosition || positions.length" id="carteIncident" class="lv-carte" role="img" aria-label="Carte de l'alerte"></div>
          <p v-if="!choisie.dernierePosition && !positions.length" class="lv-aide">Aucune position reçue pour cette alerte.</p>
          <ul class="lv-points" v-if="positions.length">
            <li v-for="(p, i) in positions" :key="i">{{ heure(p.date) }} · précision {{ p.precision }} m</li>
          </ul>
        </div></div>
      </div>
    </template>
    <template v-else>
      <div v-for="a in enAttente" :key="a.id" class="panel lv-bloc lv-alerte" :class="{auto: a.type !== 'sos'}"><div class="panel-body">
        <div class="lm-carte-ligne"><h2 class="lv-h2 lm-titre">{{ a.titre }}<template v-if="a.nom"> — {{ a.nom }}</template></h2><span class="ml-pastille" :class="ETATS[a.etat]?.cls">{{ ETATS[a.etat]?.label }}</span></div>
        <p class="ml-sous">Reçu à {{ heure(a.date) }}<template v-if="a.numero"> · {{ a.numero }}</template><template v-if="a.reponduLe"> · A répondu à {{ heure(a.reponduLe) }}</template></p>
        <div class="lv-actions"><button class="ml-btn noir" @click="ouvrir(a)">Ouvrir</button></div>
      </div></div>
      <div class="lv-filtres" role="group" aria-label="Filtrer par statut">
        <label>Statut<select v-model="filtre"><option value="">Tous</option><option v-for="(e, cle) in ETATS" :key="cle" :value="cle">{{ e.label }}</option></select></label>
      </div>
      <p v-if="erreurListe" class="ml-message erreur" role="alert">Impossible de charger cette liste. Vérifiez la connexion, puis rechargez la page.</p>
      <p v-else-if="enCache" class="ml-message erreur" role="alert">Connexion impossible : cette liste n'est peut-être pas à jour</p>
      <div v-if="!charge" class="lv-chargement" role="status" aria-label="Chargement"><span class="sq"></span><span class="sq"></span><span class="sq"></span></div>
      <p v-else-if="!affichees.length && !incertain && !erreurListe" class="lv-vide">{{ filtre ? 'Aucun incident avec ce statut.' : 'Aucun incident. Tout va bien.' }}</p>
      <template v-else-if="affichees.length">
      <barre-lot v-if="sel.selection.value.length" :resume="resumeLot" @vider="sel.vider">
        <button type="button" class="lot-action rouge" @click="demander(sel.selection.value)">Supprimer</button>
      </barre-lot>
      <label v-if="sel.selectionnables.value.length" class="lot-tout"><span class="lot-case"><input type="checkbox" :checked="sel.toutCoche.value" @change="sel.toutBasculer"/></span>Tout sélectionner</label>
      <table class="ml-table">
        <thead><tr><th class="lot-col"><label class="lot-case"><input type="checkbox" aria-label="Tout sélectionner" :disabled="!sel.selectionnables.value.length" :checked="sel.toutCoche.value" @change="sel.toutBasculer"/></label></th><th>Réf.</th><th>Type</th><th>Personne</th><th>Livraison</th><th>Heure</th><th>Statut</th><th></th></tr></thead>
        <tbody><tr v-for="a in affichees" :key="a.id">
          <td class="lot-cell" data-label="Sélection"><label v-if="termine(a)" class="lot-case"><input type="checkbox" :aria-label="'Sélectionner ' + reference(a)" :checked="sel.estCoche(a)" @change="sel.basculer(a)"/></label></td>
          <td data-label="Réf.">{{ reference(a) }}</td>
          <td data-label="Type"><b>{{ a.titre }}</b></td>
          <td data-label="Personne">{{ a.nom || '—' }}</td>
          <td data-label="Livraison">{{ a.numero || '—' }}</td>
          <td data-label="Heure">{{ dateHeure(a.date) }}</td>
          <td data-label="Statut"><span class="ml-pastille" :class="ETATS[a.etat]?.cls">{{ ETATS[a.etat]?.label }}</span></td>
          <td data-label="Actions"><div class="ml-actions fo-actions">
            <button class="ml-btn petit" @click="ouvrir(a)">Ouvrir</button>
            <button v-if="termine(a)" type="button" class="fo-icone rouge" :aria-label="'Supprimer ' + reference(a)" title="Supprimer" @click="demander([a])"><i class="ph ph-trash" style="font-size:15px" aria-hidden="true"></i></button>
            <span v-else class="fo-rien">Protégé</span>
          </div></td>
        </tr></tbody>
      </table>
      </template>
      <div class="panel lv-liste-suite"><div class="panel-body">
        <h2 class="lv-h2">Alertes automatiques</h2>
        <ul class="lv-points">
          <li><b>Une heure sans réponse :</b> la page du livreur envoie sa position et demande « Tout va bien ? ». Sans réponse 15 minutes plus tard, alerte aux admins : « Le livreur ne répond pas », « Immobile depuis 1 h » ou « Position non reçue ».</li>
          <li><b>12 h :</b> alerte si une livraison lancée le matin est toujours sans nouvelles depuis 30 minutes.</li>
          <li><b>19 h 30 :</b> alerte pour chaque colis encore chez le livreur. S'il n'est ni livré ni retourné, il est signalé de nouveau le lendemain matin.</li>
          <li><b>Relance :</b> si aucun admin ne prend une alerte en 15 minutes, tous les admins sont prévenus une seconde fois.</li>
          <li><b>SOS non transmis :</b> sans Internet, le téléphone réessaie et propose d'appeler directement.</li>
        </ul>
      </div></div>
    </template>
  </div>
</div>
<fenetre-confirmation v-if="aSupprimer" :titre="aSupprimer.length > 1 ? 'Supprimer ' + aSupprimer.length + ' incidents ?' : 'Supprimer cet incident ?'" :note="'Cette action est irréversible. Les positions du SOS sont supprimées avec.'" libelle="Supprimer" danger :envoi="suppressionEnvoi" :erreur="suppressionErreur" @annuler="aSupprimer = null" @confirmer="confirmerSuppression"></fenetre-confirmation>
</div>
<script type="module" src="../js/admin/auth-guard.js"></script>
<script src="../js/sw-register.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
<script src="/js/storage-namespace-migration.js"></script>
<script src="/js/transition-pages.js"></script>
<script src="/js/admin/app-mobile.js"></script>
<meta charset="UTF-8"/>
<link rel="icon" href="favicon.svg" type="image/svg+xml"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content"/>
<meta name="robots" content="noindex, nofollow"/>
<link rel="manifest" href="manifest.json"/>
<meta name="theme-color" content="#111111"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="apple-mobile-web-app-title" content="Bokki Admin"/>
<link rel="apple-touch-icon" href="../assets/bokki-admin-apple-touch.png"/>
<script>
(function(){
  var theme = localStorage.getItem('bokki-theme') || 'jour';
  document.documentElement.setAttribute('data-theme', theme);
})();
</script>
<title>Bokki Admin — Ma livraison</title>
<!-- Polices communes à toutes les pages admin, demandées dès le début : sans cela, le premier affichage
     se faisait avec une police de secours puis basculait (titre « Commandes » → « COMMANDES »). -->
<link rel="preload" href="/assets/fonts/space-grotesk-400.woff2" as="font" type="font/woff2" crossorigin/>
<link rel="preload" href="/assets/fonts/space-grotesk-600.woff2" as="font" type="font/woff2" crossorigin/>
<link rel="preload" href="/assets/fonts/bebas-neue-400.woff2" as="font" type="font/woff2" crossorigin/>
<link rel="preload" href="/assets/fonts/jetbrains-mono-500.woff2" as="font" type="font/woff2" crossorigin/>
<link rel="preload" href="/assets/fonts/fraunces-900.woff2" as="font" type="font/woff2" crossorigin/>
<link rel="preload" href="/assets/phosphor/Phosphor.subset.woff2" as="font" type="font/woff2" crossorigin/>
<link rel="preload" href="/assets/phosphor/Phosphor-Bold.subset.woff2" as="font" type="font/woff2" crossorigin/>
<link rel="stylesheet" href="../assets/fonts/fonts.css"/>
<link rel="stylesheet" href="../css/base.css"/>
<link rel="stylesheet" href="../css/admin.css"/>
<link rel="modulepreload" href="/vendor/vue-3.5.42.esm-browser.prod.js"/>
<link rel="stylesheet" href="../css/theme-jour.css"/>
<link rel="stylesheet" href="../css/theme-nuit.css"/>
<!-- Même coquille de page que Livreurs (feuilles par page). -->
<link rel="stylesheet" href="../css/pages/admin-07-livreurs.css"/>
<link rel="stylesheet" href="../css/pages/admin-16-mes-livraisons.css"/>
  <link rel="stylesheet" href="../assets/phosphor/phosphor-subset.css"/>
<link rel="stylesheet" href="../css/admin-app.css"/>
<script type="module" blocking="render" src="../js/admin/ma-livraison.js"></script>
<script type="module" blocking="render" src="../js/admin/sidebar-component.js"></script>
<!-- Transitions sans à-coup : la page n'est affichée qu'une fois Vue monté (barre latérale + contenu),
     scripts ci-dessus en blocking="render" (dans <head>, sinon sans effet). Pendant ce temps la page
     précédente reste à l'écran, comme dans une appli. Réseau lent : au bout de 1,5 s on affiche quand
     même la page (« Chargement… » de v-cloak) plutôt qu'un écran figé. -->
<script>setTimeout(function(){document.querySelectorAll('script[blocking="render"]').forEach(function(s){s.removeAttribute("blocking")})},1500)</script>
</head>
<body data-page-livreur>
<div id="scrollProgress"></div>

<div id="adminSidebar"></div>

<div id="mesLivraisonsApp" v-cloak>
<div class="main">
  <div class="topbar">
    <div>
      <div class="tb-title">Ma livraison</div>
      <div class="tb-date">{{ sousTitre }}</div>
    </div>
    <div class="tb-actions">
      <span class="ml-reseau" :class="{off: horsLigne}"><span class="ml-point"></span>{{ horsLigne ? 'Hors ligne' : 'En ligne' }}</span>
    </div>
  </div>

  <div class="content">
    <p v-if="messageAction" class="ml-message" :class="messageType" role="status">{{ messageAction }}</p>

    <div v-if="sansCompte" class="panel"><div class="panel-body ml-vide">
      Votre compte n'est lié à aucun livreur. <a href="livreurs.html">Ouvrez Livreurs</a> et donnez un accès avec votre e-mail.
    </div></div>

    <template v-else-if="vueDetail">
      <button type="button" class="ml-retour" @click="fermerDetail"><i class="ph ph-arrow-left" style="font-size:15px"></i>Toutes mes livraisons</button>
      <article class="panel ml-fiche" data-testid="fiche-livraison">
        <div class="panel-body">
          <span class="ml-lbl">Client</span>
          <h2>{{ vueDetail.clientInitiales }} · {{ vueDetail.quartier }}</h2>
          <p v-if="vueDetail.repere" class="ml-sous">Repère : {{ vueDetail.repere }}</p>
          <p class="ml-encaisser">À encaisser : <b>{{ fmt(vueDetail.aEncaisser) }} GNF</b><small v-if="vueDetail.fraisAConfirmer"> + frais à confirmer</small></p>
          <p v-if="vueDetail.noteLivreur" class="ml-note"><b>Note :</b> {{ vueDetail.noteLivreur }}</p>
          <a v-if="vueDetail.telephone" class="ml-btn ligne" :href="'tel:+224' + vueDetail.telephone.replace(/\D/g, '').replace(/^224/, '')"><i class="ph ph-phone" style="font-size:16px"></i>Appeler le client</a>
        </div>
      </article>
      <article class="panel ml-fiche">
        <div class="panel-body">
          <span class="ml-lbl">Statut de la commande</span>
          <div class="ml-statut-ligne"><span class="ml-pastille" :class="infoStatut(vueDetail.statut).cls">{{ infoStatut(vueDetail.statut).label }}</span><span v-if="enAttente(vueDetail.commandeId)" class="ml-attente">Envoi en attente</span></div>
          <button v-if="peutPartir(vueDetail)" type="button" class="ml-btn noir" @click="partir(vueDetail)">Passer en « En livraison »</button>
          <p v-if="peutPartir(vueDetail)" class="ml-sous">Le client et l'admin voient le nouveau statut tout de suite.</p>
          <button v-if="vueDetail.statut === 'en_livraison'" type="button" class="ml-btn noir" @click="validerCode(vueDetail)">Valider le code (Livrée)</button>
          <template v-if="peutSignaler(vueDetail)">
            <span class="ml-lbl ml-pb">Un problème ? Changer le statut</span>
            <button v-for="s in PROBLEMES" :key="s.statut" type="button" class="ml-btn gros" @click="ouvrirProbleme(vueDetail, s.statut)">{{ s.libelle }}</button>
          </template>
        </div>
      </article>
    </template>

    <template v-else>
      <div class="ml-compteurs">
        <div class="sum-card"><div class="sc-val">{{ compteurs.aLivrer }}</div><div class="sc-lbl">À livrer</div></div>
        <div class="sum-card"><div class="sc-val">{{ compteurs.enLivraison }}</div><div class="sc-lbl">En livraison</div></div>
        <div class="sum-card"><div class="sc-val">{{ compteurs.livrees }}</div><div class="sc-lbl">Livrées aujourd'hui</div></div>
      </div>

      <div v-if="charge && !duJour.length" class="panel"><div class="panel-body ml-vide">Aucune livraison pour aujourd'hui.</div></div>
      <div v-if="!charge" class="panel"><div class="panel-body sq-carte" aria-hidden="true"><span class="sq sq-l c"></span><span class="sq sq-l"></span><span class="sq sq-l m"></span></div></div>

      <table v-if="duJour.length" class="ml-table">
        <thead><tr><th>Commande</th><th>Client</th><th>À encaisser</th><th>Statut</th><th>Actions</th></tr></thead>
        <tbody>
          <tr v-for="l in duJour" :key="l.commandeId" :data-numero="l.numero">
            <td data-label="Commande"><button type="button" class="ml-lien" @click="ouvrirDetail(l)">{{ l.numero }}</button></td>
            <td data-label="Client">{{ l.clientInitiales }} · {{ l.quartier }}</td>
            <td data-label="À encaisser" class="ml-montant">{{ fmt(l.aEncaisser) }} GNF</td>
            <td data-label="Statut"><span class="ml-pastille" :class="infoStatut(l.statut).cls">{{ infoStatut(l.statut).label }}</span><span v-if="enAttente(l.commandeId)" class="ml-attente">Envoi en attente</span></td>
            <td data-label="Actions">
              <div class="ml-actions">
                <button v-if="peutPartir(l)" type="button" class="ml-btn noir petit" @click="partir(l)">Passer en livraison</button>
                <button v-if="l.statut === 'en_livraison'" type="button" class="ml-btn noir petit" @click="validerCode(l)">Valider le code</button>
                <div v-if="peutSignaler(l)" class="ml-menu">
                  <button type="button" class="ml-btn ligne petit" :aria-expanded="menuOuvert === l.commandeId" @click="menuOuvert = menuOuvert === l.commandeId ? null : l.commandeId">Changer le statut <i class="ph ph-caret-down" style="font-size:12px"></i></button>
                  <div v-if="menuOuvert === l.commandeId" class="ml-menu-liste">
                    <button v-for="s in PROBLEMES" :key="s.statut" type="button" @click="ouvrirProbleme(l, s.statut)">{{ s.libelle }}</button>
                  </div>
                </div>
                <a v-if="l.telephone" class="ml-btn ligne petit ml-appel" :href="'tel:+224' + l.telephone.replace(/\D/g, '').replace(/^224/, '')" aria-label="Appeler le client"><i class="ph ph-phone" style="font-size:15px"></i></a>
                <span v-if="!peutPartir(l) && l.statut !== 'en_livraison' && !peutSignaler(l)" class="ml-sous">Terminée</span>
              </div>
            </td>
          </tr>
        </tbody>
      </table>

      <p class="ml-rappel"><b>Un seul statut, partout.</b> Quand vous changez un statut ici, il change aussi dans « Commandes » et dans le suivi du client, qui reçoit sa notification habituelle. « Livrée » se fait toujours en validant le code du client.</p>
      <button v-if="pushProposable" type="button" class="ml-btn ligne petit" @click="activerNotifications">Recevoir mes attributions par notification</button>
    </template>
  </div>
</div>

<div class="overlay" :class="{open: !!probleme}">
  <div class="modal" v-if="probleme">
    <div class="modal-head">
      <h2>{{ probleme.libelle }}</h2>
      <button class="modal-close" aria-label="Fermer" @click="probleme = null"><i class="ph-bold ph-x" style="font-size:15px"></i></button>
    </div>
    <div class="modal-body">
      <p class="hint">Commande {{ probleme.livraison.numero }}. Êtes-vous sûr ?</p>
      <p v-if="problemeErreur" class="form-error" role="alert">{{ problemeErreur }}</p>
      <div class="field" v-if="probleme.statut === 'retournee'">
        <label for="mlRaison">Raison</label>
        <select id="mlRaison" v-model="raison">
          <option value="">Choisir…</option>
          <option value="client_absent">Client absent</option>
          <option value="refus">Refus du client</option>
          <option value="autre">Autre raison</option>
        </select>
      </div>
      <div class="field" v-if="probleme.statut === 'annulee_client'">
        <label for="mlAnnulation">Raison (obligatoire)</label>
        <input id="mlAnnulation" type="text" maxlength="200" v-model="raison"/>
      </div>
      <div class="field" v-if="probleme.statut === 'endommagee'">
        <label for="mlPhoto">Photo (obligatoire)</label>
        <input id="mlPhoto" type="file" accept="image/*" capture="environment" @change="choisirPhoto"/>
      </div>
      <div class="field" v-if="probleme.statut !== 'annulee_client'">
        <label for="mlCommentaire">Commentaire{{ probleme.statut === 'endommagee' ? ' (obligatoire)' : '' }}</label>
        <textarea id="mlCommentaire" rows="2" maxlength="500" v-model="commentaire"></textarea>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn-cancel" @click="probleme = null">Annuler</button>
      <button class="btn-confirm" @click="validerProbleme">Oui, confirmer</button>
    </div>
  </div>
</div>

</div>
<script type="module" src="../js/admin/auth-guard.js"></script>
<script src="../js/sw-register.js"></script>
</body>
</html>

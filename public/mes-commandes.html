<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<script>
(function(){
  var theme = localStorage.getItem('makiti-theme') || 'jour';
  document.documentElement.setAttribute('data-theme', theme);
})();
</script>
<title>Makitti — Mes commandes</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://firestore.googleapis.com"/>
<link rel="preconnect" href="https://firebasestorage.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="css/base.css"/>
<link rel="stylesheet" href="css/client.css"/>
<link rel="stylesheet" href="css/theme-jour.css"/>
<link rel="stylesheet" href="css/theme-nuit.css"/>
<link rel="manifest" href="manifest.json"/>
<meta name="theme-color" content="#0B1220"/>
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Makitti"/>
<link rel="stylesheet" href="css/pages/12-mes-commandes.css"/>
  <script src="https://unpkg.com/@phosphor-icons/web" defer></script>
</head>
<body>
<div id="scrollProgress"></div>

<header>
  <div class="container hdr-row">
    <a href="index.html" class="logo">MAKITTI<span class="dot"></span></a>
    <div class="hdr-actions" style="margin-left:auto">
      <button class="icon-btn" data-theme-toggle aria-label="Changer de thème">
        <i class="ph ph-sun icon-sun" style="font-size:18px"></i>
        <i class="ph ph-moon icon-moon" style="font-size:18px"></i>
      </button>
    </div>
  </div>
</header>

<section class="track-hero">
  <div class="container">
    <span class="eyebrow">Mes commandes</span>
    <h1>Toutes vos commandes,<br/>au même endroit.</h1>
    <p>Retrouvées automatiquement depuis les commandes passées sur cet appareil.</p>
  </div>
</section>

<div class="container mc-main">

  <div class="mc-tabs" id="mcTabs">
    <button class="mc-tab active" data-filter="toutes">Toutes <span class="mc-count" id="countToutes">0</span></button>
    <button class="mc-tab" data-filter="en_cours">En cours <span class="mc-count" id="countEnCours">0</span></button>
  </div>

  <p class="mc-loading" id="mcLoading">Chargement de vos commandes…</p>

  <div class="mc-list" id="mcList" hidden></div>

  <div class="mc-empty" id="mcEmpty" hidden>
    <i class="ph ph-package" style="font-size:32px"></i>
    <p>Vous n'avez pas encore de commande enregistrée sur cet appareil.</p>
    <a href="index.html" class="btn-primary">Découvrir la boutique</a>
  </div>

</div>

<script src="js/scroll-reveal.js"></script>
<script src="js/theme-toggle.js"></script>
<script type="module" src="js/firebase-config.js"></script>
<script type="module" src="js/mes-commandes.js"></script>
<script src="js/sw-register.js"></script>
<script src="js/ios-install-prompt.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<link rel="icon" href="favicon.svg" type="image/svg+xml"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<script>
(function(){
  var theme = localStorage.getItem('makiti-theme') || 'jour';
  document.documentElement.setAttribute('data-theme', theme);
})();
</script>
<title>Bokki — Mes commandes</title>
<link rel="preconnect" href="https://firestore.googleapis.com"/>
<link rel="preconnect" href="https://firebasestorage.googleapis.com"/>
<link rel="stylesheet" href="assets/fonts/fonts.css"/>
<link rel="stylesheet" href="css/base.css"/>
<link rel="stylesheet" href="css/client.css"/>
<link rel="stylesheet" href="css/theme-jour.css"/>
<link rel="stylesheet" href="css/theme-nuit.css"/>
<link rel="manifest" href="manifest.json"/>
<meta name="theme-color" content="#0B1220"/>
<link rel="apple-touch-icon" href="assets/bokki-apple-touch.png"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Bokki"/>
<link rel="stylesheet" href="css/pages/12-mes-commandes.css"/>
  <link rel="stylesheet" href="assets/phosphor/phosphor-subset.css"/>
</head>
<body>
<div id="scrollProgress"></div>

<header>
  <div class="hdr-row">
    <a href="index.html" class="logo"><svg class="baobab" viewBox="0 0 120 120" aria-hidden="true"><g class="baobab-crown"><circle cx="60" cy="44" r="23"/><circle cx="37" cy="50" r="14"/><circle cx="83" cy="50" r="14"/><circle cx="49" cy="30" r="13"/><circle cx="73" cy="30" r="13"/></g><path class="baobab-trunk" d="M42,109 C42,88 50,70 53,55 L67,55 C70,70 78,88 78,109 C78,111 76,112 74,110.5 C70,108 66,107 60,107 C54,107 50,108 46,110.5 C44,112 42,111 42,109 Z"/></svg><span class="brand-word">Bokki<span class="dot"></span></span></a>
    <div class="search" role="search">
      <input type="search" id="searchInput" aria-label="Chercher un produit" placeholder="Rechercher un produit…"/>
      <button type="button" class="search-go" id="searchGo" aria-label="Rechercher">
        <i class="ph-bold ph-magnifying-glass" aria-hidden="true" style="font-size:15px"></i>
      </button>
    </div>
    <div class="hdr-actions">
      <a href="panier.html" class="icon-btn" aria-label="Panier">
        <i class="ph ph-shopping-cart" aria-hidden="true" style="font-size:18px"></i>
        <span class="panier-badge" id="panierBadge" hidden>0</span>
      </a>
      <a href="suivi.html" class="icon-btn" aria-label="Suivi de commande">
        <i class="ph ph-bell" aria-hidden="true" style="font-size:18px"></i>
      </a>
      <button type="button" class="icon-btn" data-theme-toggle aria-label="Changer de thème">
        <i class="ph ph-sun icon-sun" aria-hidden="true" style="font-size:18px"></i>
        <i class="ph ph-moon icon-moon" aria-hidden="true" style="font-size:18px"></i>
      </button>
    </div>
  </div>
</header>

<section class="track-hero">
  <div class="container">
    <span class="eyebrow">Mes commandes</span>
    <h1>Toutes vos commandes,<br/>au même endroit.</h1>
    <p>Retrouvées automatiquement depuis les commandes passées sur cet appareil.</p>
  </div>
</section>

<div class="container mc-main">

  <div class="mc-tabs" id="mcTabs">
    <button class="mc-tab active" data-filter="toutes">Toutes <span class="mc-count" id="countToutes">0</span></button>
    <button class="mc-tab" data-filter="en_cours">En cours <span class="mc-count" id="countEnCours">0</span></button>
  </div>

  <p class="mc-loading" id="mcLoading">Chargement de vos commandes…</p>

  <div class="mc-list" id="mcList" hidden></div>

  <div class="mc-empty" id="mcEmpty" hidden>
    <i class="ph ph-package" style="font-size:32px"></i>
    <p>Vous n'avez pas encore de commande enregistrée sur cet appareil.</p>
    <a href="index.html" class="btn-primary">Découvrir la boutique</a>
  </div>

</div>

<script src="js/scroll-reveal.js"></script>
<script src="js/theme-toggle.js"></script>
<script src="js/header-search.js"></script>
<script type="module" src="js/panier-badge.js"></script>
<script type="module" src="js/firebase-config.js"></script>
<script type="module" src="js/mes-commandes.js"></script>
<script src="js/sw-register.js"></script>
<script src="js/ios-install-prompt.js"></script>
</body>
</html>
